[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthquake-dl-hrgnss"
version = "0.1.0"
description = "CNN-based earthquake magnitude estimation from HR-GNSS displacement tensors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tensorflow>=2.15",
  "obspy>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
